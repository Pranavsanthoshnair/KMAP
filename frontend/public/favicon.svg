<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#15803D"/>
    </linearGradient>
    <linearGradient id="leafL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ADE80"/>
      <stop offset="100%" style="stop-color:#16A34A"/>
    </linearGradient>
    <linearGradient id="leafR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86EFAC"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#86EFAC"/>
    </linearGradient>
    <filter id="leafGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#16A34A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- White BG -->
  <rect width="200" height="200" fill="#FFFFFF"/>

  <!-- Soil arc -->
  <path d="M38 172 Q100 160 162 172" fill="none" stroke="#92400E" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="55"  cy="173" r="2.5" fill="#92400E" fill-opacity="0.3"/>
  <circle cx="80"  cy="170" r="2"   fill="#92400E" fill-opacity="0.22"/>
  <circle cx="120" cy="170" r="2"   fill="#92400E" fill-opacity="0.22"/>
  <circle cx="145" cy="173" r="2.5" fill="#92400E" fill-opacity="0.3"/>

  <!-- Main stem -->
  <path d="M100 168 Q97 135 100 92"
        fill="none" stroke="url(#stem)" stroke-width="5" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Left leaf — large -->
  <path d="M98 138 Q58 116 36 76 Q68 82 98 122Z"
        fill="url(#leafL)" filter="url(#leafGlow)"/>
  <!-- Left leaf vein -->
  <path d="M98 134 Q72 112 46 80" fill="none" stroke="#fff" stroke-width="1.2" stroke-opacity="0.45" stroke-linecap="round"/>

  <!-- Right leaf — large -->
  <path d="M102 122 Q142 100 164 60 Q132 66 102 108Z"
        fill="url(#leafR)" filter="url(#leafGlow)"/>
  <!-- Right leaf vein -->
  <path d="M102 118 Q128 96 158 64" fill="none" stroke="#fff" stroke-width="1.2" stroke-opacity="0.45" stroke-linecap="round"/>

  <!-- Small left leaf higher up -->
  <path d="M98 108 Q74 96 64 72 Q82 77 98 100Z"
        fill="#4ADE80" fill-opacity="0.75"/>

  <!-- Top sprout curl -->
  <path d="M100 92 Q106 74 116 62 Q124 52 130 44"
        fill="none" stroke="url(#sproutGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sprout bud -->
  <circle cx="131" cy="42" r="9" fill="#86EFAC" filter="url(#leafGlow)"/>
  <circle cx="131" cy="42" r="4.5" fill="#fff" fill-opacity="0.85"/>

  <!-- Dewdrop -->
  <ellipse cx="70" cy="106" rx="3.5" ry="5" fill="#BAE6FD" fill-opacity="0.75"/>

</svg>
